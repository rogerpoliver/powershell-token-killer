[tools]
go = "1.26.2"
lefthook = "latest"

[tasks.hooks]
description = "Install lefthook git hooks (pre-commit + commit-msg)"
run = "lefthook install"

[tasks.build]
description = "Build ptk binary"
run = "go build -o ptk ."

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.check]
description = "Full quality gate: build + vet + test"
run = "go build ./... && go vet ./... && go test ./..."

[tasks.install]
description = "Install ptk to GOPATH/bin"
run = "go install ."

[tasks.clean]
description = "Remove built binary"
run = "rm -f ptk ptk.exe"

[tasks.lint]
description = "Run go vet (static analysis)"
run = "go vet ./..."

[tasks.fmt]
description = "Format all Go source files"
run = "gofmt -w ."

[tasks.init-claude]
description = "Install PTK hooks for Claude Code"
run = "./ptk init --claude"

[tasks.init-copilot]
description = "Install PTK hooks for GitHub Copilot (MCP + instructions)"
run = "./ptk init --copilot"

[tasks.init-all]
description = "Install PTK hooks for both Claude Code and GitHub Copilot"
run = "./ptk init --claude --copilot"

[tasks.mcp]
description = "Start PTK MCP server (for Copilot agent mode)"
run = "./ptk serve --mcp"

[tasks.gain]
description = "Show token savings report"
run = "./ptk gain"
